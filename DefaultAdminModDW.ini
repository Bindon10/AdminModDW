[Engine.GameInfo]
DefaultGame=AdminModDW.AdminModDWTD

; Prefix -> gametype.
;
; Deadliest Warrior registers BOTH spellings of every mode: the inherited AOC* prefixes and
; a short form (TD-, TO-, DUEL-, PTB-, ...). Both are in the stock DefaultMapPrefixes in
; CDWGame\Config\CDWGame.ini and PCServer-CDWGame.ini, and DW's own maps use the short one,
; so a table with only the AOC* forms silently runs vanilla gametypes on half the rotation.
; Claim both. SetGameType compares with ~= so case does not matter.
;
; Deliberately NOT claimed:
;   AOC     -- the entry/frontend map (CDW.AOCEntry). Claiming it would put a gametype on
;              the main menu map.
;   CTF, AOCCTF, SURV, AOCSURV, CTL, AOCCTL -- vanilla registers these pointing at
;              CDW.AOCCTF / AOCSurvival / AOCCTL, none of which exist in this SDK. They are
;              dead entries in the stock ini, not modes to support.
;   MOV, AOCMOV -- AOCTrailerGame, no maps.
;   TO2     -- Horde is a Medieval Warfare mode; CMWTO2 does not exist here.
;
; AOCDUEL is claimed on purpose. Vanilla AOCGame.SetGameType (AOCGame.uc:3791) injects it at
; runtime pointing at "CDW.AOCDUEL" -- a class that does not exist -- and StaticSaveConfig
; writes it into the server ini, where it is visible at PCServer-CDWGame.ini:1511. Our
; override runs first, so claiming it fixes that dead lookup as a side effect.
[AdminModDW.AdminModDWTD]
SDKPrefixes=(Prefix="AOCTD",GameType="AdminModDW.AdminModDWTD")
SDKPrefixes=(Prefix="TD",GameType="AdminModDW.AdminModDWTD")
SDKPrefixes=(Prefix="AOCTO",GameType="AdminModDW.AdminModDWTO")
SDKPrefixes=(Prefix="TO",GameType="AdminModDW.AdminModDWTO")
SDKPrefixes=(Prefix="AOCFFA",GameType="AdminModDW.AdminModDWFFA")
SDKPrefixes=(Prefix="FFA",GameType="AdminModDW.AdminModDWFFA")
SDKPrefixes=(Prefix="AOCLTS",GameType="AdminModDW.AdminModDWLTS")
SDKPrefixes=(Prefix="LTS",GameType="AdminModDW.AdminModDWLTS")
SDKPrefixes=(Prefix="AOCKOTH",GameType="AdminModDW.AdminModDWKOTH")
SDKPrefixes=(Prefix="KOTH",GameType="AdminModDW.AdminModDWKOTH")
SDKPrefixes=(Prefix="AOCTUT",GameType="AdminModDW.AdminModDWTUT")
SDKPrefixes=(Prefix="TUT",GameType="AdminModDW.AdminModDWTUT")
SDKPrefixes=(Prefix="DUEL",GameType="AdminModDW.AdminModDWDuel")
SDKPrefixes=(Prefix="AOCDUEL",GameType="AdminModDW.AdminModDWDuel")
SDKPrefixes=(Prefix="PTB",GameType="AdminModDW.AdminModDWPTB")
SDKPrefixes=(Prefix="HTB",GameType="AdminModDW.AdminModDWHTB")

; One section per gametype. The key itself is not a real property -- it exists so the
; section is non-empty and survives the ini parser.

[AdminModDW.AdminModDWTO]
AdminModDWSectionMarker=1

[AdminModDW.AdminModDWFFA]
AdminModDWSectionMarker=1

[AdminModDW.AdminModDWLTS]
AdminModDWSectionMarker=1

[AdminModDW.AdminModDWKOTH]
AdminModDWSectionMarker=1

[AdminModDW.AdminModDWTUT]
AdminModDWSectionMarker=1

[AdminModDW.AdminModDWDuel]
AdminModDWSectionMarker=1

[AdminModDW.AdminModDWPTB]
AdminModDWSectionMarker=1

[AdminModDW.AdminModDWHTB]
AdminModDWSectionMarker=1

; Console verbs RCON refuses to run, matched case-insensitively on the first token.
; These MUST live here, not in DefaultProperties -- the compiler rejects a config
; array seeded from defaults, which left the list empty and 'quit' runnable.
; Scope 1 runs on the SERVER-side controller, so quit aimed at a player kills the server.
[AdminModDW.AdminModDWRCon]
AdminModDWBlockedConsoleCommands=quit
AdminModDWBlockedConsoleCommands=exit
AdminModDWBlockedConsoleCommands=debug
